<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">羚藝汽泡水電子存摺</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./config.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Loading 遮罩 -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/50 z-50 flex flex-col items-center justify-center text-white gap-3" style="display: none;">
        <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
        <p id="loading-text" class="font-medium text-sm">與雲端試算表同步中...</p>
    </div>

    <!-- 幹部設定彈出視窗 -->
    <div id="modal-role" class="hidden-view fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-xl">
            <h3 class="font-bold mb-4 text-lg flex items-center gap-2"><i data-lucide="award" class="text-amber-500"></i> 設定幹部與薪水</h3>
            <input type="hidden" id="role-stu-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">幹部名稱 (留白即為移除)</label>
                    <input type="text" id="role-name" placeholder="例如：班長、風紀股長" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">薪水點數</label>
                        <input type="number" id="role-salary" min="0" placeholder="0" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">發放週期</label>
                        <select id="role-cycle" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="weekly">每週</option>
                            <option value="monthly">每月</option>
                            <option value="none">無</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="app.closeModal('modal-role')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm transition">取消</button>
                <button onclick="app.submitRole()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg text-sm shadow transition font-medium">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 老師管理登入彈出視窗 -->
    <div id="modal-teacher-login" class="hidden-view fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg flex items-center gap-2 text-slate-800">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center">
                        <i data-lucide="shield-check" class="w-5 h-5"></i>
                    </div>
                    老師管理登入
                </h3>
                <button onclick="app.closeModal('modal-teacher-login')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">管理密碼</label>
                    <input type="password" id="modal-login-pwd" placeholder="請輸入管理密碼" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition" onkeypress="if(event.key === 'Enter') app.loginTeacherFromModal()">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="app.closeModal('modal-teacher-login')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                <button onclick="app.loginTeacherFromModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm shadow transition font-bold flex items-center justify-center gap-1.5">
                    <i data-lucide="log-in" class="w-4 h-4"></i> 登入後台
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm"></div>

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
            <div class="flex items-center gap-2 cursor-pointer select-none" onclick="app.showOverview()" title="返回全班總表">
                <i data-lucide="droplets" class="w-6 h-6 text-blue-200"></i>
                <h1 id="header-title" class="text-xl font-bold tracking-wide">羚藝氣泡水電子存摺</h1>
            </div>
            <!-- 公開模式操作（總表／個人歷史） -->
            <div id="public-header-actions" class="flex items-center gap-2 sm:gap-3">
                <button onclick="app.fetchCloudData(true)" class="bg-blue-500 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition flex items-center gap-1.5 shadow-sm" title="重新同步雲端資料">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">重新整理</span>
                </button>
                <button onclick="app.openTeacherLoginModal()" class="bg-white/15 hover:bg-white/25 border border-white/30 text-white px-3 py-1.5 rounded text-sm transition flex items-center gap-1.5 shadow-sm font-medium">
                    <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                    <span>老師管理</span>
                </button>
            </div>
            <!-- 老師模式操作 -->
            <div id="user-info" class="hidden-view flex items-center gap-2 sm:gap-3">
                <span id="welcome-text" class="text-sm font-bold bg-blue-700 px-2.5 py-1 rounded">老師您好</span>
                <button id="btn-back-to-teacher" onclick="app.goBackToTeacher()" class="hidden-view bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded text-sm transition shadow flex items-center gap-1.5 font-bold">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">返回管理</span>
                </button>
                <button onclick="app.fetchCloudData(true)" class="bg-blue-500 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition flex items-center gap-1.5 shadow-sm" title="重新同步雲端資料">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">重新整理</span>
                </button>
                <button onclick="app.logout()" class="bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded text-sm transition shadow flex items-center gap-1 font-medium">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i> 登出
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 py-6">
        <!-- 全班點數總表（首頁） -->
        <div id="view-overview" class="space-y-5">
            <div id="connection-alert" class="hidden-view bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm flex items-center justify-between gap-3">
                <span id="connection-alert-text">無法連線至雲端試算表</span>
                <button onclick="app.fetchCloudData(true)" class="shrink-0 bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded-lg text-xs font-medium transition">重試</button>
            </div>

            <!-- 總表抬頭與篩選工具列 -->
            <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="p-1.5 rounded-lg bg-blue-100 text-blue-600"><i data-lucide="layout-grid" class="w-5 h-5"></i></span>
                        <h2 class="text-xl font-bold text-slate-800">全班點數總表</h2>
                        <span id="overview-student-count-badge" class="bg-blue-50 text-blue-700 border border-blue-200 text-xs px-2.5 py-0.5 rounded-full font-bold">載入中...</span>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">點擊自己的座號卡片，即可查看個人給點、扣點的詳細歷史紀錄。</p>
                </div>
                <div class="flex flex-wrap items-center gap-2.5">
                    <div class="relative flex-grow sm:flex-grow-0 sm:w-56">
                        <input type="text" id="overview-search" placeholder="搜尋座號或姓名..." oninput="app.renderOverviewStudents()" class="w-full border border-slate-300 rounded-xl pl-8 pr-3 py-2 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5"></i>
                    </div>
                    <select id="overview-sort" onchange="app.renderOverviewStudents()" class="border border-slate-300 rounded-xl px-3 py-2 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="seat-asc">座號順序 (1 → 26)</option>
                        <option value="points-desc">點數排行 (高 → 低)</option>
                        <option value="points-asc">點數排行 (低 → 高)</option>
                    </select>
                </div>
            </div>

            <!-- 學生卡片網格 -->
            <div id="overview-student-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4"></div>

            <!-- 底部一鍵分享/建置說明 -->
            <div class="text-center pt-2">
                <a href="./setup.html" class="inline-flex items-center gap-1.5 text-xs text-slate-500 hover:text-blue-600 transition bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
                    <span>老師想複製這套電子存摺給自己班級使用？點此一鍵建立專屬網址</span>
                </a>
            </div>
        </div>

        <!-- 學生專區（個人歷史紀錄） -->
        <div id="view-student" class="hidden-view space-y-5">
            <!-- 頂部返回導覽 -->
            <div class="flex items-center justify-between">
                <button onclick="app.showOverview()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-300 shadow-sm transition font-bold text-sm group">
                    <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"></i>
                    <span>返回首頁（全班總表）</span>
                </button>
                <div class="text-xs text-slate-400 font-medium hidden sm:block">點擊座號卡片檢視之個人明細</div>
            </div>

            <!-- 學生資訊卡片 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-blue-50 via-sky-50 to-indigo-50 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center shadow-md">
                            <span id="stu-seat-badge" class="text-2xl font-black">1</span>
                        </div>
                        <div>
                            <div class="text-xs font-semibold text-slate-500 mb-0.5">座號 <span id="stu-seat" class="font-bold text-slate-700"></span> 號</div>
                            <h2 id="stu-name" class="text-2xl font-bold text-slate-800"></h2>
                            <div id="stu-role-badge" class="hidden mt-1.5">
                                <span id="stu-role" class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full text-xs font-bold border border-amber-200 inline-flex items-center gap-1">
                                    <i data-lucide="award" class="w-3 h-3 text-amber-600"></i>
                                    <span id="stu-role-text"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="text-center md:text-right">
                        <div class="text-xs text-slate-500 mb-1">目前累積點數</div>
                        <div class="text-4xl font-black text-blue-600 flex items-center justify-center md:justify-end gap-1.5">
                            <i data-lucide="coins" class="w-8 h-8 text-amber-500"></i>
                            <span id="stu-points">0</span>
                            <span class="text-sm font-bold text-slate-500">點</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 歷史紀錄表格區塊 -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 space-y-4">
                <div class="flex items-center justify-between flex-wrap gap-3 border-b border-slate-100 pb-3">
                    <div class="flex gap-2">
                        <button id="tab-btn-stu-personal" onclick="app.switchStudentHistoryTab('personal')" class="px-3.5 py-1.5 rounded-lg text-sm font-bold bg-blue-100 text-blue-700 flex items-center gap-1.5 transition">
                            <i data-lucide="user" class="w-4 h-4"></i> 個人異動紀錄
                        </button>
                        <button id="tab-btn-stu-class" onclick="app.switchStudentHistoryTab('class')" class="px-3.5 py-1.5 rounded-lg text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center gap-1.5 transition">
                            <i data-lucide="users" class="w-4 h-4"></i> 全班歷史動態
                        </button>
                    </div>
                    <div id="stu-class-filter-bar" class="hidden flex items-center gap-2">
                        <input type="text" id="stu-class-search" placeholder="搜尋座號、姓名或事由..." oninput="app.renderStudentClassHistory()" class="border rounded-lg px-2.5 py-1 text-xs outline-none focus:ring-1 focus:ring-blue-500 w-48">
                    </div>
                </div>

                <!-- 個人紀錄表格 -->
                <div id="stu-personal-history-wrap" class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 border-b"><tr><th class="p-3">時間</th><th class="p-3">異動</th><th class="p-3">原因</th></tr></thead>
                        <tbody id="stu-history-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>

                <!-- 全班動態表格 -->
                <div id="stu-class-history-wrap" class="hidden-view overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 border-b">
                            <tr>
                                <th class="p-3">時間</th>
                                <th class="p-3">座號</th>
                                <th class="p-3">姓名</th>
                                <th class="p-3">異動</th>
                                <th class="p-3">原因</th>
                            </tr>
                        </thead>
                        <tbody id="stu-class-history-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>

                <!-- 底部返回按鈕 -->
                <div class="pt-3 border-t border-slate-100 flex justify-center">
                    <button onclick="app.showOverview()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition shadow-sm">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>返回全班點數總表</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 老師專區 -->
        <div id="view-teacher" class="hidden-view space-y-5">
            <!-- 老師分頁標籤切換 -->
            <div class="flex items-center justify-between border-b border-slate-200 gap-4 pb-1">
                <div class="flex gap-2 sm:gap-4">
                    <button id="tab-btn-teacher-students" onclick="app.switchTeacherTab('students')" class="pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 transition">
                        <i data-lucide="users" class="w-4 h-4"></i>
                        <span>學生點數管理</span>
                    </button>
                    <button id="tab-btn-teacher-history" onclick="app.switchTeacherTab('history')" class="pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 transition">
                        <i data-lucide="history" class="w-4 h-4"></i>
                        <span>全班歷史紀錄</span>
                        <span id="teacher-history-badge" class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                    </button>
                </div>
            </div>

            <!-- 分頁 1: 學生列表與加扣點操作 -->
            <div id="teacher-students-section" class="space-y-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end justify-between">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="app.selectAllStudents()" class="bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded text-sm border transition">全選</button>
                        <button onclick="app.clearSelection()" class="bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded text-sm border transition">清除選取</button>
                        <button onclick="app.payAllSalaries()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded text-sm font-medium shadow flex items-center gap-1 transition ml-2"><i data-lucide="banknote" class="w-4 h-4"></i> 發放薪水</button>
                    </div>
                    <div class="flex flex-wrap items-end gap-2 flex-grow justify-end">
                        <select id="bulk-action" class="border rounded px-2 py-1.5 text-sm outline-none"><option value="add">加點 (+)</option><option value="deduct">扣點 (-)</option></select>
                        <input type="number" id="bulk-points" min="1" placeholder="點數" class="border rounded px-2 py-1.5 text-sm w-20 outline-none">
                        <input type="text" id="bulk-reason" placeholder="原因說明" class="border rounded px-2 py-1.5 text-sm w-40 outline-none">
                        <button onclick="app.submitBulkAction()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-sm font-medium shadow transition flex items-center gap-1"><i data-lucide="zap" class="w-4 h-4"></i> 批量執行</button>
                    </div>
                </div>
                <div id="teacher-student-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
            </div>

            <!-- 分頁 2: 全班歷史紀錄管理 -->
            <div id="teacher-history-section" class="hidden-view space-y-5">
                <!-- 統計概覽卡片 -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500 mb-1">總紀錄筆數</div>
                        <div id="hist-stat-total-count" class="text-xl sm:text-2xl font-black text-slate-800">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500 mb-1">累積加點 (+)</div>
                        <div id="hist-stat-total-add" class="text-xl sm:text-2xl font-black text-emerald-600">+0</div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs text-slate-500 mb-1">累積扣點 (-)</div>
                        <div id="hist-stat-total-deduct" class="text-xl sm:text-2xl font-black text-rose-600">-0</div>
                    </div>
                </div>

                <!-- 歷史紀錄篩選與工具列 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
                    <div class="flex flex-wrap items-center gap-2 flex-grow">
                        <!-- 學生下拉選單 -->
                        <select id="teacher-hist-filter-stu" onchange="app.onTeacherHistoryFilterChange()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all">全班學生 (全部)</option>
                        </select>
                        <!-- 類型選單 -->
                        <select id="teacher-hist-filter-type" onchange="app.onTeacherHistoryFilterChange()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="all">全部異動 (加/扣點)</option>
                            <option value="add">僅加點 (+)</option>
                            <option value="deduct">僅扣點 (-)</option>
                        </select>
                        <!-- 搜尋框 -->
                        <div class="relative flex-grow max-w-xs">
                            <input type="text" id="teacher-hist-search" placeholder="搜尋座號、姓名或事由..." oninput="app.onTeacherHistoryFilterChange()" class="w-full border border-slate-300 rounded-lg pl-8 pr-3 py-1.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5"></i>
                        </div>
                        <button onclick="app.resetTeacherHistoryFilters()" class="text-slate-500 hover:text-slate-800 text-xs px-2 py-1.5 rounded transition">
                            重設
                        </button>
                    </div>

                    <!-- 匯出 CSV 按鈕 -->
                    <button onclick="app.exportHistoryCsv()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium shadow transition flex items-center gap-1.5 shrink-0">
                        <i data-lucide="download" class="w-4 h-4"></i> 匯出 CSV
                    </button>
                </div>

                <!-- 歷史紀錄表格卡片 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-600 border-b">
                                <tr>
                                    <th class="p-3">時間</th>
                                    <th class="p-3">座號</th>
                                    <th class="p-3">姓名</th>
                                    <th class="p-3">異動</th>
                                    <th class="p-3">原因</th>
                                </tr>
                            </thead>
                            <tbody id="teacher-history-tbody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>

                    <!-- 分頁控制 -->
                    <div class="p-3 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2 text-xs text-slate-500">
                        <span id="teacher-history-page-info">顯示第 0 筆</span>
                        <div class="flex items-center gap-2">
                            <button id="btn-hist-prev" onclick="app.changeTeacherHistoryPage(-1)" class="px-2.5 py-1 rounded border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
                                上一頁
                            </button>
                            <button id="btn-hist-next" onclick="app.changeTeacherHistoryPage(1)" class="px-2.5 py-1 rounded border border-slate-200 bg-white hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed">
                                下一頁
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Creator Signature -->
    <footer class="py-6 text-center text-xs text-slate-400 font-medium tracking-wide">
        ✨ 偉朕老師以 Antigravity 製作
    </footer>

    <script>
        const REQUEST_TIMEOUT_MS = 25000;

        const app = {
            state: {
                role: null,
                currentView: 'overview',
                currentUser: null,
                teacherPassword: null,
                students: [],
                history: [],
                selectedIds: new Set(),
                isBusy: false,
                cloudReady: false,
                teacherTab: 'students',
                teacherHistoryPage: 1,
                teacherHistoryPageSize: 50,
                studentHistoryTab: 'personal'
            },

            init() {
                this.applyUrlConfig();
                lucide.createIcons();
                this.fetchCloudData();
            },

            applyUrlConfig() {
                const params = new URLSearchParams(window.location.search);
                const customId = (params.get('id') || '').trim();
                const customApi = (params.get('api') || '').trim();
                const customTitle = (params.get('title') || '').trim().slice(0, 40);

                if (customTitle) {
                    document.title = customTitle;
                    document.getElementById('header-title').textContent = customTitle;
                } else if (customId || customApi) {
                    const fallbackTitle = '班級電子存摺';
                    document.title = fallbackTitle;
                    document.getElementById('header-title').textContent = fallbackTitle;
                }
            },

            normalizeGasUrl(rawUrl) {
                let clean = String(rawUrl || '').trim();
                clean = clean.replace(/\/u\/\d+\//g, '/');

                if (/^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.-]+\/s|macros\/s)\/[A-Za-z0-9_-]{20,}\/exec$/.test(clean)) {
                    return clean;
                }
                const m = clean.match(/^https:\/\/script\.google\.com\/a\/([A-Za-z0-9.-]+\.[A-Za-z]{2,})\/macros\/s\/([A-Za-z0-9_-]{20,})\/exec$/);
                if (m) {
                    return `https://script.google.com/a/macros/${m[1]}/s/${m[2]}/exec`;
                }
                return '';
            },

            getApiUrl() {
                const params = new URLSearchParams(window.location.search);
                const customId = (params.get('id') || '').trim();
                const customDomain = (params.get('domain') || '').trim();
                if (customId) {
                    if (!/^[A-Za-z0-9_-]{20,}$/.test(customId)) return '';
                    if (customDomain) {
                        if (!/^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(customDomain)) return '';
                        return `https://script.google.com/a/macros/${customDomain}/s/${customId}/exec`;
                    }
                    return `https://script.google.com/macros/s/${customId}/exec`;
                }

                const customApi = (params.get('api') || '').trim();
                if (customApi) {
                    return this.normalizeGasUrl(customApi);
                }

                const raw = (window.PASSBOOK_CONFIG && window.PASSBOOK_CONFIG.cloudApiUrl) ? window.PASSBOOK_CONFIG.cloudApiUrl : '';
                return this.normalizeGasUrl(raw);
            },

            escapeHtml(str) {
                return String(str == null ? '' : str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            },

            showLoading(show, text = '與雲端試算表同步中...') {
                this.state.isBusy = show;
                document.getElementById('loading-text').innerText = text;
                document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
            },

            setConnectionAlert(show, text = '') {
                const el = document.getElementById('connection-alert');
                if (show) {
                    document.getElementById('connection-alert-text').innerText = text;
                    el.classList.remove('hidden-view');
                } else {
                    el.classList.add('hidden-view');
                }
            },

            closeModal(id) { document.getElementById(id).classList.add('hidden-view'); },

            async requestCloud(method, payload = null, queryAction = 'getData') {
                const apiUrl = this.getApiUrl();
                if (!apiUrl) {
                    throw new Error('Google Apps Script 部署網址格式不正確（應為 https://script.google.com/macros/s/.../exec）');
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

                try {
                    const options = {
                        method: method,
                        signal: controller.signal
                    };
                    let url = apiUrl;

                    if (method === 'GET') {
                        const sep = apiUrl.includes('?') ? '&' : '?';
                        url = `${apiUrl}${sep}action=${encodeURIComponent(queryAction)}&t=${Date.now()}`;
                    } else {
                        options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                        options.body = JSON.stringify(payload || {});
                    }

                    const res = await fetch(url, options);
                    const text = await res.text();

                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (parseErr) {
                        throw new Error('雲端 API 回傳非 JSON 格式，請確認已將新版 Code.gs 部署為網頁應用程式（誰可以存取：所有人）');
                    }

                    if (!res.ok) {
                        throw new Error((data && data.message) || `HTTP ${res.status}`);
                    }

                    if (!data || data.status !== 'success') {
                        const err = new Error((data && data.message) || '雲端處理失敗');
                        err.code = data && data.code ? data.code : '';
                        throw err;
                    }

                    return data;
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        throw new Error('連線逾時，請檢查網路後再試');
                    }
                    if (err instanceof TypeError && /Failed to fetch|NetworkError|Load failed/i.test(err.message)) {
                        throw new Error('無法連線至雲端 API：請確認網路正常，並確認新版 Code.gs 已部署且「誰可以存取」設為「所有人」');
                    }
                    throw err;
                } finally {
                    clearTimeout(timeoutId);
                }
            },

            applyCloudData(data) {
                this.state.students = Array.isArray(data.students) ? data.students : [];
                this.state.history = Array.isArray(data.history) ? data.history : [];
                this.state.cloudReady = true;
                this.setConnectionAlert(false);

                if (this.state.role === 'teacher' && this.state.currentView === 'teacher') {
                    this.renderTeacherStudents();
                    this.renderTeacherHistory();
                } else if (this.state.currentView === 'student' && this.state.currentUser) {
                    this.updateStudentDashboard();
                    if (this.state.studentHistoryTab === 'class') {
                        this.renderStudentClassHistory();
                    }
                } else {
                    this.renderOverviewStudents();
                }
            },

            async fetchCloudData(showSuccessToast = false) {
                if (this.state.isBusy) return;
                this.showLoading(true, '正在從雲端試算表讀取最新資料...');
                try {
                    const data = await this.requestCloud('GET', null, 'getData');
                    this.applyCloudData(data);
                    if (showSuccessToast) this.showToast('資料已更新至最新狀態', 'success');
                } catch (err) {
                    this.state.cloudReady = false;
                    this.setConnectionAlert(true, err.message || '無法連線至雲端試算表');
                    this.showToast(err.message || '雲端資料讀取失敗', 'error');
                } finally {
                    this.showLoading(false);
                }
            },

            renderOverviewStudents() {
                const grid = document.getElementById('overview-student-grid');
                if (!grid) return;
                grid.innerHTML = '';

                const countBadge = document.getElementById('overview-student-count-badge');
                if (countBadge) {
                    countBadge.innerText = `${this.state.students.length} 位同學`;
                }

                if (!this.state.cloudReady && this.state.students.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-16 text-center text-slate-400">
                            <div class="flex flex-col items-center gap-3">
                                <div class="w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                <span class="text-sm font-medium">正在載入全班存摺點數...</span>
                            </div>
                        </div>
                    `;
                    return;
                }

                const keyword = (document.getElementById('overview-search')?.value || '').trim().toLowerCase();
                const sortBy = document.getElementById('overview-sort')?.value || 'seat-asc';

                let list = [...this.state.students];

                // 排序
                if (sortBy === 'points-desc') {
                    list.sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0) || (a.id - b.id));
                } else if (sortBy === 'points-asc') {
                    list.sort((a, b) => (Number(a.points) || 0) - (Number(b.points) || 0) || (a.id - b.id));
                } else {
                    list.sort((a, b) => a.id - b.id);
                }

                // 關鍵字搜尋（座號、姓名、幹部職位）
                if (keyword) {
                    list = list.filter(s => {
                        const matchText = `${s.id} ${s.name} ${s.role || ''}`.toLowerCase();
                        return matchText.includes(keyword);
                    });
                }

                if (list.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full py-12 text-center text-slate-400">
                            <div class="flex flex-col items-center gap-2">
                                <i data-lucide="search-x" class="w-8 h-8 text-slate-300"></i>
                                <span>找不到符合「${this.escapeHtml(keyword)}」的同學</span>
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                list.forEach(s => {
                    const div = document.createElement('div');
                    div.className = "group relative bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-400 hover:-translate-y-0.5 cursor-pointer transition flex flex-col justify-between";
                    div.onclick = () => app.openStudentHistory(s.id);
                    div.title = `點擊查看 ${s.id} 號 ${s.name} 的個人點數紀錄`;

                    const roleHtml = s.role ? `
                        <span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200 truncate max-w-[80px]" title="${this.escapeHtml(s.role)}">
                            ${this.escapeHtml(s.role)}
                        </span>
                    ` : '<div class="h-4"></div>';

                    div.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-black bg-blue-50 text-blue-700 px-2 py-0.5 rounded-lg border border-blue-100">${s.id} 號</span>
                                ${roleHtml}
                            </div>
                            <div class="text-center my-1.5">
                                <div class="font-bold text-base sm:text-lg text-slate-800 truncate">${this.escapeHtml(s.name)}</div>
                            </div>
                            <div class="text-center my-2">
                                <div class="text-2xl sm:text-3xl font-black text-blue-600 flex items-center justify-center gap-1">
                                    <span>${s.points}</span>
                                    <span class="text-xs font-bold text-slate-400">點</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-center gap-1 text-[11px] text-blue-500 font-bold group-hover:text-blue-700 transition">
                            <span>查看紀錄</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform"></i>
                        </div>
                    `;
                    grid.appendChild(div);
                });
                lucide.createIcons();
            },

            openStudentHistory(id) {
                const stu = this.state.students.find(s => s.id === id);
                if (!stu) return;

                this.state.currentUser = stu;
                this.state.currentView = 'student';
                this.state.studentHistoryTab = 'personal';

                document.getElementById('view-overview')?.classList.add('hidden-view');
                document.getElementById('view-teacher')?.classList.add('hidden-view');
                document.getElementById('view-student')?.classList.remove('hidden-view');

                this.switchStudentHistoryTab('personal');
                this.updateStudentDashboard();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            showOverview() {
                this.state.currentView = 'overview';
                this.state.currentUser = null;

                document.getElementById('view-student')?.classList.add('hidden-view');
                document.getElementById('view-teacher')?.classList.add('hidden-view');
                document.getElementById('view-overview')?.classList.remove('hidden-view');

                if (this.state.role === 'teacher') {
                    document.getElementById('public-header-actions')?.classList.add('hidden-view');
                    document.getElementById('user-info')?.classList.remove('hidden-view');
                    document.getElementById('btn-back-to-teacher')?.classList.remove('hidden-view');
                } else {
                    document.getElementById('public-header-actions')?.classList.remove('hidden-view');
                    document.getElementById('user-info')?.classList.add('hidden-view');
                }

                this.renderOverviewStudents();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            goBackToTeacher() {
                this.state.currentView = 'teacher';
                document.getElementById('view-overview')?.classList.add('hidden-view');
                document.getElementById('view-student')?.classList.add('hidden-view');
                document.getElementById('view-teacher')?.classList.remove('hidden-view');
                document.getElementById('btn-back-to-teacher')?.classList.add('hidden-view');
                this.renderTeacherView();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            openTeacherLoginModal() {
                const pwdInput = document.getElementById('modal-login-pwd');
                if (pwdInput) pwdInput.value = '';
                document.getElementById('modal-teacher-login')?.classList.remove('hidden-view');
                setTimeout(() => {
                    if (pwdInput && typeof pwdInput.focus === 'function') pwdInput.focus();
                }, 100);
            },

            async loginTeacherFromModal() {
                if (this.state.isBusy) return;
                const pwd = (document.getElementById('modal-login-pwd')?.value || '').trim();
                if (!pwd) return this.showToast('請輸入管理密碼', 'error');

                this.showLoading(true, '正在驗證管理密碼...');
                try {
                    const data = await this.requestCloud('POST', {
                        action: 'verifyTeacher',
                        password: pwd
                    });
                    this.closeModal('modal-teacher-login');
                    this.state.teacherPassword = pwd;
                    this.state.role = 'teacher';
                    this.state.currentView = 'teacher';
                    this.applyCloudData(data);
                    this.renderTeacherView();
                    this.showToast('老師登入成功！', 'success');
                } catch (err) {
                    this.showToast(err.message || '登入失敗，密碼錯誤', 'error');
                } finally {
                    this.showLoading(false);
                }
            },

            // 向後相容呼叫
            async login(type) {
                if (type === 'teacher') {
                    this.openTeacherLoginModal();
                }
            },

            logout(silent = false) {
                this.state.role = null;
                this.state.currentUser = null;
                this.state.teacherPassword = null;
                this.state.selectedIds.clear();
                this.state.teacherTab = 'students';
                this.state.studentHistoryTab = 'personal';
                const pwdInput = document.getElementById('modal-login-pwd');
                if (pwdInput) pwdInput.value = '';
                this.showOverview();
                if (!silent) this.showToast('已登出管理模式', 'info');
            },

            renderTeacherView() {
                this.state.currentView = 'teacher';
                document.getElementById('view-overview')?.classList.add('hidden-view');
                document.getElementById('view-student')?.classList.add('hidden-view');
                document.getElementById('view-teacher')?.classList.remove('hidden-view');
                document.getElementById('public-header-actions')?.classList.add('hidden-view');
                document.getElementById('user-info')?.classList.remove('hidden-view');
                document.getElementById('btn-back-to-teacher')?.classList.add('hidden-view');
                document.getElementById('welcome-text').innerText = '老師您好';
                this.switchTeacherTab(this.state.teacherTab || 'students');
                this.renderTeacherStudents();
                this.renderTeacherHistory();
            },

            renderStudentView() {
                if (this.state.currentUser) {
                    this.openStudentHistory(this.state.currentUser.id);
                } else {
                    this.showOverview();
                }
            },

            updateStudentDashboard() {
                if (!this.state.currentUser) return;
                const stu = this.state.students.find(s => s.id === this.state.currentUser.id);
                if (!stu) return;
                this.state.currentUser = stu;

                const seatBadge = document.getElementById('stu-seat-badge');
                if (seatBadge) seatBadge.innerText = stu.id;
                document.getElementById('stu-seat').innerText = stu.id;
                document.getElementById('stu-name').innerText = stu.name;
                document.getElementById('stu-points').innerText = stu.points;

                const roleBadge = document.getElementById('stu-role-badge');
                const roleText = document.getElementById('stu-role-text');
                const roleSpan = document.getElementById('stu-role');
                if (stu.role) {
                    roleBadge.classList.remove('hidden');
                    if (roleText) roleText.innerText = stu.role;
                    else if (roleSpan) roleSpan.innerText = stu.role;
                } else {
                    roleBadge.classList.add('hidden');
                }

                const tbody = document.getElementById('stu-history-list');
                tbody.innerHTML = '';
                const myHistory = this.state.history.filter(h => h.studentId === stu.id).slice(0, 100);

                if (myHistory.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-slate-400 font-medium">尚無給點、扣點異動紀錄</td></tr>';
                    return;
                }

                myHistory.forEach(h => {
                    const ch = Number(h.change) || 0;
                    const isAdd = ch >= 0;
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';
                    tr.innerHTML = `
                        <td class="p-3 text-slate-500 whitespace-nowrap text-xs">${this.escapeHtml(h.timestamp)}</td>
                        <td class="p-3 whitespace-nowrap font-bold ${isAdd ? 'text-emerald-600' : 'text-rose-600'}">
                            <span class="inline-flex items-center gap-0.5">${isAdd ? '+' : ''}${ch}</span>
                        </td>
                        <td class="p-3 text-slate-700">${this.escapeHtml(h.reason)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            },

            renderTeacherStudents() {
                const grid = document.getElementById('teacher-student-grid');
                grid.innerHTML = '';
                this.state.students.forEach(s => {
                    const isSelected = this.state.selectedIds.has(s.id);
                    const div = document.createElement('div');
                    div.className = `relative p-3 rounded-lg border cursor-pointer transition-all ${isSelected ? 'bg-blue-50 border-blue-400 ring-1 ring-blue-400' : 'bg-white border-slate-200 hover:border-blue-300'}`;

                    div.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        this.toggleSelection(s.id);
                    };

                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs font-bold text-slate-400 bg-slate-100 px-1.5 rounded">${s.id} 號</span>
                            <div class="flex items-center gap-0.5">
                                <button onclick="app.viewStudentHistoryInTeacher(${s.id})" class="text-slate-400 hover:text-blue-600 transition p-1" title="查看該生歷史紀錄"><i data-lucide="file-text" class="w-4 h-4"></i></button>
                                <button onclick="app.openRoleModal(${s.id})" class="text-slate-400 hover:text-amber-500 transition p-1" title="設定幹部"><i data-lucide="award" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="text-center mb-1">
                            <div class="font-bold text-lg truncate">${this.escapeHtml(s.name)}</div>
                            ${s.role ? `<div class="text-[10px] text-amber-600 bg-amber-50 rounded-full inline-block px-2 border border-amber-100 mt-1 truncate max-w-full">${this.escapeHtml(s.role)}</div>` : '<div class="h-4 mt-1"></div>'}
                        </div>
                        <div class="text-2xl font-black text-center text-blue-600">${s.points}</div>
                    `;
                    grid.appendChild(div);
                });
                lucide.createIcons();
            },

            toggleSelection(id) {
                if (this.state.selectedIds.has(id)) this.state.selectedIds.delete(id);
                else this.state.selectedIds.add(id);
                this.renderTeacherStudents();
            },
            selectAllStudents() { this.state.students.forEach(s => this.state.selectedIds.add(s.id)); this.renderTeacherStudents(); },
            clearSelection() { this.state.selectedIds.clear(); this.renderTeacherStudents(); },

            // --- 歷史紀錄相關切換與篩選功能 ---
            switchTeacherTab(tab) {
                this.state.teacherTab = tab;
                const btnStudents = document.getElementById('tab-btn-teacher-students');
                const btnHistory = document.getElementById('tab-btn-teacher-history');
                const secStudents = document.getElementById('teacher-students-section');
                const secHistory = document.getElementById('teacher-history-section');

                if (tab === 'students') {
                    if (btnStudents) btnStudents.className = 'pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 transition';
                    if (btnHistory) btnHistory.className = 'pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 transition';
                    if (secStudents) secStudents.classList.remove('hidden-view');
                    if (secHistory) secHistory.classList.add('hidden-view');
                } else {
                    if (btnHistory) btnHistory.className = 'pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 transition';
                    if (btnStudents) btnStudents.className = 'pb-2.5 px-3 text-sm sm:text-base font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 transition';
                    if (secStudents) secStudents.classList.add('hidden-view');
                    if (secHistory) secHistory.classList.remove('hidden-view');
                    this.renderTeacherHistory();
                }
                lucide.createIcons();
            },

            viewStudentHistoryInTeacher(id) {
                this.switchTeacherTab('history');
                const select = document.getElementById('teacher-hist-filter-stu');
                if (select) {
                    select.value = String(id);
                }
                this.state.teacherHistoryPage = 1;
                this.renderTeacherHistory();
            },

            onTeacherHistoryFilterChange() {
                this.state.teacherHistoryPage = 1;
                this.renderTeacherHistory();
            },

            resetTeacherHistoryFilters() {
                const stuSelect = document.getElementById('teacher-hist-filter-stu');
                const typeSelect = document.getElementById('teacher-hist-filter-type');
                const searchInput = document.getElementById('teacher-hist-search');
                if (stuSelect) stuSelect.value = 'all';
                if (typeSelect) typeSelect.value = 'all';
                if (searchInput) searchInput.value = '';
                this.state.teacherHistoryPage = 1;
                this.renderTeacherHistory();
            },

            changeTeacherHistoryPage(delta) {
                this.state.teacherHistoryPage += delta;
                this.renderTeacherHistory();
            },

            updateTeacherHistoryStats() {
                const history = this.state.history || [];
                let totalAdd = 0;
                let totalDeduct = 0;
                history.forEach(h => {
                    const ch = Number(h.change) || 0;
                    if (ch > 0) totalAdd += ch;
                    else if (ch < 0) totalDeduct += Math.abs(ch);
                });

                const badge = document.getElementById('teacher-history-badge');
                if (badge) badge.innerText = history.length;
                const statCount = document.getElementById('hist-stat-total-count');
                if (statCount) statCount.innerText = history.length;
                const statAdd = document.getElementById('hist-stat-total-add');
                if (statAdd) statAdd.innerText = `+${totalAdd}`;
                const statDeduct = document.getElementById('hist-stat-total-deduct');
                if (statDeduct) statDeduct.innerText = `-${totalDeduct}`;
            },

            populateTeacherHistoryStudentDropdown() {
                const select = document.getElementById('teacher-hist-filter-stu');
                if (!select) return;
                const currentVal = select.value;
                select.innerHTML = '<option value="all">全班學生 (全部)</option>';
                this.state.students.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.id} 號 ${s.name}`;
                    select.appendChild(opt);
                });
                if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                    select.value = currentVal;
                }
            },

            getFilteredTeacherHistory() {
                const stuFilter = document.getElementById('teacher-hist-filter-stu')?.value || 'all';
                const typeFilter = document.getElementById('teacher-hist-filter-type')?.value || 'all';
                const keyword = (document.getElementById('teacher-hist-search')?.value || '').trim().toLowerCase();

                return this.state.history.filter(h => {
                    if (stuFilter !== 'all' && Number(h.studentId) !== Number(stuFilter)) return false;
                    const ch = Number(h.change) || 0;
                    if (typeFilter === 'add' && ch <= 0) return false;
                    if (typeFilter === 'deduct' && ch >= 0) return false;
                    if (keyword) {
                        const matchText = `${h.studentId} ${h.studentName} ${h.reason} ${h.timestamp}`.toLowerCase();
                        if (!matchText.includes(keyword)) return false;
                    }
                    return true;
                });
            },

            renderTeacherHistory() {
                this.updateTeacherHistoryStats();
                this.populateTeacherHistoryStudentDropdown();

                const filtered = this.getFilteredTeacherHistory();
                const total = filtered.length;
                const pageSize = this.state.teacherHistoryPageSize;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));

                if (this.state.teacherHistoryPage > totalPages) {
                    this.state.teacherHistoryPage = totalPages;
                }
                if (this.state.teacherHistoryPage < 1) {
                    this.state.teacherHistoryPage = 1;
                }
                const page = this.state.teacherHistoryPage;
                const startIdx = (page - 1) * pageSize;
                const paged = filtered.slice(startIdx, startIdx + pageSize);

                const tbody = document.getElementById('teacher-history-tbody');
                if (!tbody) return;
                tbody.innerHTML = '';

                if (paged.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400"><div class="flex flex-col items-center gap-2"><i data-lucide="inbox" class="w-8 h-8 text-slate-300"></i><span>尚無符合條件的歷史紀錄</span></div></td></tr>';
                    lucide.createIcons();
                } else {
                    paged.forEach(h => {
                        const ch = Number(h.change) || 0;
                        const isAdd = ch >= 0;
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 transition';
                        tr.innerHTML = `
                            <td class="p-3 text-slate-500 whitespace-nowrap text-xs sm:text-sm">${this.escapeHtml(h.timestamp)}</td>
                            <td class="p-3 whitespace-nowrap"><span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs font-bold">${h.studentId} 號</span></td>
                            <td class="p-3 whitespace-nowrap font-medium text-slate-800">${this.escapeHtml(h.studentName)}</td>
                            <td class="p-3 whitespace-nowrap font-bold ${isAdd ? 'text-emerald-600' : 'text-rose-600'}">
                                <span class="inline-flex items-center gap-0.5">${isAdd ? '+' : ''}${ch}</span>
                            </td>
                            <td class="p-3 text-slate-700">${this.escapeHtml(h.reason)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                const infoEl = document.getElementById('teacher-history-page-info');
                if (infoEl) {
                    const startNum = total === 0 ? 0 : startIdx + 1;
                    const endNum = Math.min(startIdx + pageSize, total);
                    infoEl.innerText = `顯示第 ${startNum} - ${endNum} 筆 (共 ${total} 筆，頁次 ${page}/${totalPages})`;
                }
                const prevBtn = document.getElementById('btn-hist-prev');
                const nextBtn = document.getElementById('btn-hist-next');
                if (prevBtn) prevBtn.disabled = page <= 1;
                if (nextBtn) nextBtn.disabled = page >= totalPages;
            },

            exportHistoryCsv() {
                if (!this.state.history || this.state.history.length === 0) {
                    return this.showToast('目前尚無歷史紀錄可供匯出', 'warning');
                }
                const headers = ['時間', '座號', '姓名', '異動點數', '原因'];
                const rows = this.state.history.map(h => [
                    `"${String(h.timestamp || '').replace(/"/g, '""')}"`,
                    h.studentId,
                    `"${String(h.studentName || '').replace(/"/g, '""')}"`,
                    h.change,
                    `"${String(h.reason || '').replace(/"/g, '""')}"`
                ]);
                const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\r\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const dateStr = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `全班點數歷史紀錄_${dateStr}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast('已成功匯出 CSV 歷史紀錄！', 'success');
            },

            switchStudentHistoryTab(tab) {
                this.state.studentHistoryTab = tab;
                const btnPersonal = document.getElementById('tab-btn-stu-personal');
                const btnClass = document.getElementById('tab-btn-stu-class');
                const wrapPersonal = document.getElementById('stu-personal-history-wrap');
                const wrapClass = document.getElementById('stu-class-history-wrap');
                const filterBar = document.getElementById('stu-class-filter-bar');

                if (tab === 'personal') {
                    if (btnPersonal) btnPersonal.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-blue-100 text-blue-700 flex items-center gap-1.5 transition';
                    if (btnClass) btnClass.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center gap-1.5 transition';
                    if (wrapPersonal) wrapPersonal.classList.remove('hidden-view');
                    if (wrapClass) wrapClass.classList.add('hidden-view');
                    if (filterBar) filterBar.classList.add('hidden');
                } else {
                    if (btnClass) btnClass.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-blue-100 text-blue-700 flex items-center gap-1.5 transition';
                    if (btnPersonal) btnPersonal.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center gap-1.5 transition';
                    if (wrapPersonal) wrapPersonal.classList.add('hidden-view');
                    if (wrapClass) wrapClass.classList.remove('hidden-view');
                    if (filterBar) filterBar.classList.remove('hidden');
                    this.renderStudentClassHistory();
                }
                lucide.createIcons();
            },

            renderStudentClassHistory() {
                const keyword = (document.getElementById('stu-class-search')?.value || '').trim().toLowerCase();
                const tbody = document.getElementById('stu-class-history-list');
                if (!tbody) return;
                tbody.innerHTML = '';

                const list = this.state.history.filter(h => {
                    if (!keyword) return true;
                    const matchText = `${h.studentId} ${h.studentName} ${h.reason} ${h.timestamp}`.toLowerCase();
                    return matchText.includes(keyword);
                }).slice(0, 100);

                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">尚無符合條件的全班紀錄</td></tr>';
                    return;
                }

                list.forEach(h => {
                    const ch = Number(h.change) || 0;
                    const isAdd = ch >= 0;
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';
                    tr.innerHTML = `
                        <td class="p-3 text-slate-500 whitespace-nowrap text-xs">${this.escapeHtml(h.timestamp)}</td>
                        <td class="p-3 whitespace-nowrap"><span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-xs font-bold">${h.studentId} 號</span></td>
                        <td class="p-3 whitespace-nowrap font-medium text-slate-800">${this.escapeHtml(h.studentName)}</td>
                        <td class="p-3 whitespace-nowrap font-bold ${isAdd ? 'text-emerald-500' : 'text-rose-500'}">${isAdd ? '+' : ''}${ch}</td>
                        <td class="p-3 text-slate-700">${this.escapeHtml(h.reason)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            },

            handleWriteError(err) {
                if (err && err.code === 'UNAUTHORIZED') {
                    this.logout(true);
                    this.showToast('管理密碼已失效或錯誤，請重新登入', 'error');
                    return;
                }
                this.showToast((err && err.message) || '同步失敗，請稍後再試', 'error');
            },

            openRoleModal(id) {
                const s = this.state.students.find(st => st.id === id);
                if (!s) return;
                document.getElementById('role-stu-id').value = id;
                document.getElementById('role-name').value = s.role || '';
                document.getElementById('role-salary').value = s.salary || 0;
                document.getElementById('role-cycle').value = s.cycle || 'none';
                document.getElementById('modal-role').classList.remove('hidden-view');
            },

            async submitRole() {
                if (this.state.isBusy) return;
                const id = parseInt(document.getElementById('role-stu-id').value, 10);
                const role = document.getElementById('role-name').value.trim();
                const salary = parseInt(document.getElementById('role-salary').value, 10) || 0;
                const cycle = document.getElementById('role-cycle').value;

                this.closeModal('modal-role');
                this.showLoading(true, '正在儲存幹部設定...');

                try {
                    const data = await this.requestCloud('POST', {
                        action: 'updateRole',
                        password: this.state.teacherPassword,
                        id: id,
                        role: role,
                        salary: role ? salary : 0,
                        cycle: role ? cycle : 'none'
                    });
                    this.applyCloudData(data);
                    this.showToast('幹部設定已儲存', 'success');
                } catch (err) {
                    this.handleWriteError(err);
                } finally {
                    this.showLoading(false);
                }
            },

            async payAllSalaries() {
                if (this.state.isBusy) return;
                if (!confirm('確定要發放所有幹部的薪水嗎？')) return;

                this.showLoading(true, '正在發放幹部薪水...');
                try {
                    const data = await this.requestCloud('POST', {
                        action: 'paySalaries',
                        password: this.state.teacherPassword
                    });
                    this.applyCloudData(data);
                    if (data.paidCount > 0) {
                        this.showToast(`成功發放 ${data.paidCount} 位幹部的薪水！`, 'success');
                    } else {
                        this.showToast('目前沒有符合發放條件的幹部。', 'warning');
                    }
                } catch (err) {
                    this.handleWriteError(err);
                } finally {
                    this.showLoading(false);
                }
            },

            async submitBulkAction() {
                if (this.state.isBusy) return;
                if (this.state.selectedIds.size === 0) return this.showToast('請先選取學生', 'warning');
                const action = document.getElementById('bulk-action').value;
                const val = parseInt(document.getElementById('bulk-points').value, 10);
                const reason = document.getElementById('bulk-reason').value.trim() || '加扣點';

                if (!val || val <= 0) return this.showToast('請輸入有效點數', 'error');

                const updates = [];
                this.state.selectedIds.forEach(id => {
                    updates.push({ id: id, change: action === 'add' ? val : -val, reason: reason });
                });

                this.showLoading(true, '正在同步點數至雲端試算表...');
                try {
                    const data = await this.requestCloud('POST', {
                        action: 'updatePoints',
                        password: this.state.teacherPassword,
                        updates: updates
                    });
                    this.clearSelection();
                    document.getElementById('bulk-points').value = '';
                    document.getElementById('bulk-reason').value = '';
                    this.applyCloudData(data);
                    this.showToast('點數已成功同步至雲端試算表！', 'success');
                } catch (err) {
                    this.handleWriteError(err);
                } finally {
                    this.showLoading(false);
                }
            },

            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const colors = { success: 'bg-emerald-500', error: 'bg-rose-500', warning: 'bg-amber-500', info: 'bg-blue-500' };
                toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 toast-animate font-medium text-sm`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    toast.style.transition = 'all 0.3s';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
